  <path d="M 82 75 L 80 72" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 85 74 L 85 71" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 88 75 L 90 72" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

  <path d="M 112 75 L 110 72" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 115 74 L 115 71" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 118 75 L 120 72" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>
