  <path d="M 110 32 Q 115 30, 118 33" stroke="#FFF8DC" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Add cute detail - hair accessory -->
  <circle cx="135" cy="55" r="8" fill="#FF69B4"/>
  <circle cx="135" cy="55" r="5" fill="#FFB6C1"/>

