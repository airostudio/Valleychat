  <!-- Rosy Cheeks -->
  <ellipse cx="70" cy="95" rx="12" ry="8" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="130" cy="95" rx="12" ry="8" fill="#FFB6C1" opacity="0.6"/>

  <!-- Clothing - Top -->
  <path d="M 40 170 Q 50 155, 60 160 L 60 190 Q 70 185, 100 185 Q 130 185, 140 190 L 140 160 Q 150 155, 160 170" fill="#FF69B4"/>

