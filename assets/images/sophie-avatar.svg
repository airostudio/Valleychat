  <path d="M 75 70 Q 85 68, 92 70" stroke="#D4AF37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 108 70 Q 115 68, 125 70" stroke="#D4AF37" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Nose -->
